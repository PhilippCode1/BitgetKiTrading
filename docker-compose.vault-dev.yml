# Optional: lokaler Vault Dev-Server fuer Go-Live-/Tenant-Credential-Tests.
# NICHT fuer echte Production — nur Dev/Staging-Pfad.
#
# Start:
#   docker compose -f docker-compose.yml -f docker-compose.vault-dev.yml up -d vault
#   pnpm vault:dev:seed
#
# Defaults: VAULT_ADDR=http://127.0.0.1:8200  VAULT_TOKEN=dev-root-token

services:
  vault:
    image: hashicorp/vault:1.18.5
    container_name: bitget_ai_vault_dev
    networks:
      - bitget_ai_net
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=dev-root-token
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
